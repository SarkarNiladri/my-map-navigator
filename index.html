<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Map Navigator - Precision + Satellite</title>

<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#header {
    height: 60px;
    background: #fff;
    display: flex;
    align-items: center;
    padding: 0 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    position: relative;
    z-index: 30;
}

#header h2 {
    margin: 0;
    font-size: 20px;
}

#controls {
    position: absolute;
    top: 72px;
    left: 12px;
    right: 12px;
    z-index: 20;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.action-btn,
#radiusSelect {
    border: 0;
    border-radius: 22px;
    padding: 10px 13px;
    background: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.22);
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.action-btn:hover {
    background: #f1f5f9;
}

.action-btn.active {
    background: #1976d2;
    color: white;
}

.action-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#map {
    width: 100%;
    height: calc(100vh - 60px);
}

#status {
    position: absolute;
    left: 12px;
    bottom: 20px;
    z-index: 20;
    background: #fff;
    padding: 11px 14px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.22);
    font-size: 13px;
    max-width: 360px;
}

#loadingSpinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #1976d2;
    border-top: 2px solid transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

#locateBtn {
    position: absolute;
    right: 14px;
    bottom: 20px;
    z-index: 20;
    border: 0;
    border-radius: 26px;
    padding: 13px 18px;
    background: #1976d2;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,.30);
}

#locateBtn:hover {
    background: #1565c0;
}

#resultsPanel {
    position: absolute;
    top: 125px;
    right: 12px;
    width: 350px;
    max-height: calc(100vh - 180px);
    overflow-y: auto;
    z-index: 18;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,.25);
    display: none;
}

#resultsHeader {
    padding: 14px;
    font-weight: bold;
    border-bottom: 1px solid #eee;
    position: sticky;
    top: 0;
    background: #fff;
}

.place-card {
    padding: 13px 14px;
    border-bottom: 1px solid #eee;
}

.place-name {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 5px;
}

.place-meta {
    color: #555;
    font-size: 12px;
    line-height: 1.5;
}

.navigate-btn,
.clear-route-btn {
    margin-top: 8px;
    border: 0;
    border-radius: 7px;
    padding: 8px 11px;
    cursor: pointer;
    font-weight: bold;
}

.navigate-btn {
    background: #1976d2;
    color: #fff;
}

.navigate-btn:hover {
    background: #1565c0;
}

.clear-route-btn {
    margin-left: 6px;
    background: #eee;
}

.marker-pin {
    width: 30px;
    height: 30px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    background: #d32f2f;
    border: 3px solid #fff;
    box-shadow: 0 2px 7px rgba(0,0,0,.35);
}

.marker-pin span {
    display: block;
    transform: rotate(45deg);
    color: #fff;
    text-align: center;
    line-height: 24px;
    font-size: 15px;
}

.user-marker {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #1976d2;
    border: 3px solid #fff;
    box-shadow: 0 1px 7px rgba(0,0,0,.45);
}

#accuracyBadge {
    position: absolute;
    right: 14px;
    top: 125px;
    z-index: 17;
    background: rgba(255,255,255,.95);
    padding: 9px 12px;
    border-radius: 9px;
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
    font-size: 12px;
    display: none;
}

#satelliteAttribution {
    position: absolute;
    right: 8px;
    bottom: 5px;
    z-index: 12;
    background: rgba(255,255,255,.85);
    padding: 3px 6px;
    font-size: 10px;
    color: #333;
    display: none;
}

.maplibregl-popup-content {
    font-size: 13px;
    line-height: 1.5;
    max-width: 270px;
}

@media (max-width: 700px) {
    #header h2 { font-size: 17px; }

    #controls {
        top: 68px;
        left: 8px;
        right: 8px;
    }

    .action-btn,
    #radiusSelect {
        padding: 9px 10px;
        font-size: 12px;
    }

    #resultsPanel {
        left: 8px;
        right: 8px;
        top: 120px;
        width: auto;
        max-height: 48vh;
    }

    #accuracyBadge {
        top: 175px;
    }
}
</style>
</head>

<body>

<div id="header">
    <h2>🗺️ My Map Navigator</h2>
</div>

<div id="controls">
    <button class="action-btn" id="streetBtn">🗺️ Street</button>
    <button class="action-btn" id="satelliteBtn">🛰️ Satellite</button>

    <button class="action-btn" data-type="atm">🏧 ATM</button>
    <button class="action-btn" data-type="bank">🏦 Bank</button>
    <button class="action-btn" data-type="shop">🛒 Shop</button>

    <select id="radiusSelect">
        <option value="1000">Within 1 km</option>
        <option value="2000">Within 2 km</option>
        <option value="3000" selected>Within 3 km</option>
        <option value="5000">Within 5 km</option>
    </select>
</div>

<div id="map"></div>

<div id="accuracyBadge">
    GPS: waiting...
</div>

<div id="resultsPanel">
    <div id="resultsHeader">Nearby places</div>
    <div id="results"></div>
</div>

<div id="status">📍 Starting high-accuracy location...</div>

<button id="locateBtn">📍 Locate Me</button>

<div id="satelliteAttribution">
    Satellite imagery © Esri 2024
</div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

<script>
const OVERPASS_SERVERS = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
];

const OSRM_URL = "https://router.project-osrm.org";

let map;
let userMarker = null;
let currentPosition = null;
let bestAccuracy = Infinity;
let watchId = null;
let placeMarkers = [];
let routePopup = null;
let isSatellite = false;
let lastLocationUpdate = 0;
let lastStablePosition = null;
let positionUpdateTimeout = null;

const statusEl = document.getElementById("status");
const accuracyBadge = document.getElementById("accuracyBadge");
const resultsPanel = document.getElementById("resultsPanel");
const resultsEl = document.getElementById("results");
const radiusSelect = document.getElementById("radiusSelect");

// GPS stabilization parameters
const GPS_STABILIZATION = {
    POSITION_THRESHOLD: 5, // meters - minimum movement to update
    ACCURACY_THRESHOLD: 2, // meters - improvement needed
    UPDATE_DELAY: 1000,    // milliseconds - debounce delay
    MAX_ACCURACY: 50       // meters - max acceptable accuracy
};

map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: [78.9629, 20.5937],
    zoom: 5
});

map.addControl(
    new maplibregl.NavigationControl(),
    "top-left"
);

map.addControl(
    new maplibregl.FullscreenControl(),
    "top-left"
);

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatDistance(meters) {
    if (meters < 1000) return Math.round(meters) + " m";
    return (meters / 1000).toFixed(1) + " km";
}

function distanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const p1 = lat1 * Math.PI / 180;
    const p2 = lat2 * Math.PI / 180;
    const dp = (lat2 - lat1) * Math.PI / 180;
    const dl = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dp / 2) ** 2 +
        Math.cos(p1) * Math.cos(p2) *
        Math.sin(dl / 2) ** 2;

    return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );
}

function shouldUpdatePosition(newPos, newAccuracy) {
    if (!lastStablePosition) return true;
    
    const distance = distanceMeters(
        lastStablePosition.latitude,
        lastStablePosition.longitude,
        newPos.latitude,
        newPos.longitude
    );
    
    const accuracyImproved = 
        newAccuracy < bestAccuracy - GPS_STABILIZATION.ACCURACY_THRESHOLD;
    
    return distance > GPS_STABILIZATION.POSITION_THRESHOLD || accuracyImproved;
}

function updateUserPosition(position) {
    const newPos = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude
    };
    
    const newAccuracy = position.coords.accuracy;

    // Debounce and stabilize position updates
    clearTimeout(positionUpdateTimeout);
    
    if (!shouldUpdatePosition(newPos, newAccuracy)) {
        return;
    }

    positionUpdateTimeout = setTimeout(() => {
        currentPosition = newPos;
        lastStablePosition = newPos;
        bestAccuracy = Math.min(bestAccuracy, newAccuracy);
        lastLocationUpdate = Date.now();

        // Update accuracy badge
        const accText = 
            newAccuracy < 10 ? "🟢 High" :
            newAccuracy < 20 ? "🟡 Good" : "🔴 Fair";
        
        accuracyBadge.innerHTML = 
            `GPS: ${accText} (${Math.round(newAccuracy)}m)`;
        accuracyBadge.style.display = "block";

        // Update user marker position (smooth animation)
        if (!userMarker) {
            userMarker = new maplibregl.Marker(
                { element: createUserMarkerElement() }
            ).setLngLat([newPos.longitude, newPos.latitude])
             .addTo(map);
        } else {
            userMarker.setLngLat([newPos.longitude, newPos.latitude]);
        }

        statusEl.innerHTML = `📍 Location: ${newPos.latitude.toFixed(4)}, ${newPos.longitude.toFixed(4)}`;
    }, GPS_STABILIZATION.UPDATE_DELAY);
}

function createUserMarkerElement() {
    const el = document.createElement("div");
    el.className = "user-marker";
    return el;
}

function handleLocationError(error) {
    console.error("GPS Error:", error);
    
    let msg = "📍 GPS unavailable.";
    if (error.code === error.PERMISSION_DENIED) {
        msg = "❌ Location permission denied.";
    } else if (error.code === error.TIMEOUT) {
        msg = "⏱️ GPS signal timed out.";
    }
    
    statusEl.innerHTML = msg;
}

function startHighAccuracyTracking() {
    if (!navigator.geolocation) {
        statusEl.innerHTML = "❌ Geolocation not supported.";
        return;
    }

    statusEl.innerHTML = "📍 Acquiring GPS location (high accuracy)...";
    accuracyBadge.innerHTML = "GPS: 🔴 Waiting...";

    watchId = navigator.geolocation.watchPosition(
        updateUserPosition,
        handleLocationError,
        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}

function clearPlaceMarkers() {
    placeMarkers.forEach(marker => marker.remove());
    placeMarkers = [];
}

function createPlaceMarker(place, type) {
    const el = document.createElement("div");
    el.className = "marker-pin";
    
    const iconMap = {
        atm: "🏧",
        bank: "🏦",
        shop: "🛒"
    };
    
    el.innerHTML = `<span>${iconMap[type] || "📍"}</span>`;

    const marker = new maplibregl.Marker({ element: el })
        .setLngLat([place.lon, place.lat])
        .addTo(map);

    const popupContent = `
        <strong>${escapeHtml(place.name)}</strong><br>
        📏 ${place.distanceText} away<br>
        ${place.tags["addr:street"] ? `📍 ${escapeHtml(place.tags["addr:street"])}<br>` : ""}
    `;

    const popup = new maplibregl.Popup({ offset: 25 })
        .setHTML(popupContent);

    marker.setPopup(popup);
    placeMarkers.push(marker);
}

function setMapMode(satellite) {
    isSatellite = satellite;
    
    document.querySelectorAll("#streetBtn, #satelliteBtn").forEach(btn => {
        btn.classList.remove("active");
    });

    if (satellite) {
        document.getElementById("satelliteBtn").classList.add("active");
        
        // Use Esri World Imagery (fresh satellite imagery)
        const esriUrl = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
        const attribution = '© Esri 2024';
        
        // Check if satellite layer exists
        if (!map.getSource("esri-satellite")) {
            map.addSource("esri-satellite", {
                type: "raster",
                url: `pmtiles://${esriUrl}`,
                tiles: [esriUrl],
                tileSize: 256,
                attribution: attribution
            });

            // Remove street layer
            if (map.getLayer("liberty-background")) {
                const layers = map.getStyle().layers;
                const baseLayer = layers.find(l => l.type === "background" || l.id.includes("background"));
                if (baseLayer) {
                    map.removeLayer(baseLayer.id);
                }
            }

            // Add satellite layer
            map.addLayer({
                id: "esri-satellite-layer",
                type: "raster",
                source: "esri-satellite",
                minzoom: 0,
                maxzoom: 19
            }, "liberty-halo");
        } else {
            const layer = map.getLayer("esri-satellite-layer");
            if (layer) {
                map.setLayoutProperty("esri-satellite-layer", "visibility", "visible");
            }
        }

        document.getElementById("satelliteAttribution").style.display = "block";
        statusEl.innerHTML = "🛰️ Switched to satellite view";
    } else {
        document.getElementById("streetBtn").classList.add("active");
        
        // Switch back to street view
        const layer = map.getLayer("esri-satellite-layer");
        if (layer) {
            map.setLayoutProperty("esri-satellite-layer", "visibility", "none");
        }

        document.getElementById("satelliteAttribution").style.display = "none";
        statusEl.innerHTML = "🗺️ Switched to street view";
    }
}

function addSatelliteLayer() {
    // Layer is added on demand in setMapMode
}

async function fetchOverpass(query) {
    let lastError;

    for (const server of OVERPASS_SERVERS) {
        try {
            const response = await fetch(server, {
                method: "POST",
                body: query,
                signal: AbortSignal.timeout(8000) // Reduced from 25s to 8s
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            return await response.json();
        } catch (error) {
            lastError = error;
            console.warn("Overpass server failed:", server, error);
        }
    }

    throw lastError || new Error("All Overpass servers failed.");
}

function buildOverpassQuery(type, radius) {
    const lat = currentPosition.latitude;
    const lon = currentPosition.longitude;
    let filter;

    if (type === "atm") {
        filter = `nwr["amenity"="atm"](around:${radius},${lat},${lon});`;
    } else if (type === "bank") {
        filter = `nwr["amenity"="bank"](around:${radius},${lat},${lon});`;
    } else {
        filter = `nwr["shop"](around:${radius},${lat},${lon});`;
    }

    return `
        [out:json][timeout:8];
        (${filter});
        out center tags;
    `;
}

function getElementCoordinates(element) {
    if (element.type === "node") {
        return { lat: element.lat, lon: element.lon };
    }
    if (element.center) {
        return { lat: element.center.lat, lon: element.center.lon };
    }
    return null;
}

async function findNearby(type) {
    if (!currentPosition) {
        alert("Please wait until GPS location is available.");
        return;
    }

    document.querySelectorAll(".action-btn").forEach(btn => 
        btn.classList.remove("active")
    );

    const selectedButton = document.querySelector(`[data-type="${type}"]`);
    if (selectedButton) {
        selectedButton.classList.add("active");
        selectedButton.disabled = true;
    }

    const radius = Number(radiusSelect.value);

    statusEl.innerHTML = `<span id="loadingSpinner"></span>Searching for ${type}s...`;
    resultsPanel.style.display = "block";
    resultsEl.innerHTML = `<div class="place-card">🔍 Searching OpenStreetMap...</div>`;

    clearPlaceMarkers();

    try {
        const query = buildOverpassQuery(type, radius);
        const data = await fetchOverpass(query);

        const places = [];

        for (const element of data.elements || []) {
            const coords = getElementCoordinates(element);
            if (!coords) continue;

            const distance = distanceMeters(
                currentPosition.latitude,
                currentPosition.longitude,
                coords.lat,
                coords.lon
            );

            const tags = element.tags || {};
            let name = tags.name || tags.brand || tags.operator || "";

            if (!name && type === "shop") {
                name = tags.shop 
                    ? tags.shop.replaceAll("_", " ") 
                    : "Shop";
            }

            places.push({
                id: element.id,
                lat: coords.lat,
                lon: coords.lon,
                name: name || (type === "atm" ? "ATM" : type === "bank" ? "Bank" : "Shop"),
                distance,
                distanceText: formatDistance(distance),
                tags
            });
        }

        places.sort((a, b) => a.distance - b.distance);
        const visiblePlaces = places.slice(0, 30);

        if (!visiblePlaces.length) {
            resultsEl.innerHTML = `<div class="place-card">❌ No ${type}s found within ${radius / 1000} km.</div>`;
            statusEl.innerHTML = `❌ No nearby ${type}s found.`;
            if (selectedButton) selectedButton.disabled = false;
            return;
        }

        visiblePlaces.forEach(place => createPlaceMarker(place, type));

        resultsEl.innerHTML = visiblePlaces.map((place, index) => {
            const address = place.tags["addr:street"] || "";
            return `
                <div class="place-card">
                    <div class="place-name">${index + 1}. ${escapeHtml(place.name)}</div>
                    <div class="place-meta">
                        📏 ${place.distanceText} away
                        ${address ? `<br>📍 ${escapeHtml(address)}` : ""}
                    </div>
                    <button class="navigate-btn" onclick="navigateToPlace(${place.lat}, ${place.lon}, '${escapeHtml(place.name).replaceAll("'", "\\'")}')">
                        🧭 Navigate
                    </button>
                </div>
            `;
        }).join("");

        statusEl.innerHTML = `✅ Found <b>${visiblePlaces.length}</b> nearby ${type}(s).`;

    } catch (error) {
        console.error(error);
        resultsEl.innerHTML = `<div class="place-card">❌ Search timeout or error.<br><br>The service may be busy. Try again.</div>`;
        statusEl.innerHTML = "❌ Nearby search failed.";
    } finally {
        if (selectedButton) selectedButton.disabled = false;
    }
}

function navigateToPlace(lat, lon, name) {
    if (!currentPosition) return;

    statusEl.innerHTML = `🧭 Routing to ${name}...`;

    const start = `${currentPosition.longitude},${currentPosition.latitude}`;
    const end = `${lon},${lat}`;
    const url = `${OSRM_URL}/route/v1/driving/${start};${end}?overview=full&geometries=geojson`;

    fetch(url)
        .then(r => r.json())
        .then(data => {
            if (!data.routes || !data.routes[0]) {
                statusEl.innerHTML = "❌ Route calculation failed.";
                return;
            }

            const route = data.routes[0];
            const distance = (route.distance / 1000).toFixed(1);
            const duration = Math.round(route.duration / 60);

            if (map.getSource("route")) {
                map.getSource("route").setData({
                    type: "Feature",
                    geometry: route.geometry
                });
            } else {
                map.addSource("route", {
                    type: "geojson",
                    data: { type: "Feature", geometry: route.geometry }
                });

                map.addLayer({
                    id: "route",
                    type: "line",
                    source: "route",
                    layout: { "line-join": "round", "line-cap": "round" },
                    paint: { "line-color": "#1976d2", "line-width": 4, "line-opacity": 0.8 }
                });
            }

            statusEl.innerHTML = `✅ Route: ${distance} km, ~${duration} min`;
        })
        .catch(err => {
            console.error(err);
            statusEl.innerHTML = "❌ Route service error.";
        });
}

// Event listeners
document.getElementById("streetBtn").addEventListener("click", () => setMapMode(false));
document.getElementById("satelliteBtn").addEventListener("click", () => setMapMode(true));

document.getElementById("locateBtn").addEventListener("click", () => {
    if (currentPosition) {
        map.flyTo({
            center: [currentPosition.longitude, currentPosition.latitude],
            zoom: 18,
            speed: 1.2
        });
    } else {
        startHighAccuracyTracking();
    }
});

document.querySelectorAll(".action-btn[data-type]").forEach(button => {
    button.addEventListener("click", () => findNearby(button.dataset.type));
});

map.on("load", function() {
    document.getElementById("streetBtn").classList.add("active");
    startHighAccuracyTracking();
});
</script>

</body>
</html>
